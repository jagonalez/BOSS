<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BOSS app icon</title>
  <desc id="desc">A folder-shaped agent workstation displaying a terminal prompt.</desc>

  <!-- macOS icon field -->
  <rect x="32" y="32" width="960" height="960" rx="218" fill="#96AABD"/>

  <!-- Parallel project / agent layer -->
  <path
    d="M296 246h210l62 70h215c58 0 105 47 105 105v331c0 58-47 105-105 105H296c-58 0-105-47-105-105V351c0-58 47-105 105-105Z"
    fill="#23466D"
  />

  <!-- Folder + workstation + BOSS silhouette -->
  <path
    d="M196 336c0-31 25-56 56-56h176l68 78h181v-99c0-20 16-36 36-36h10c20 0 36 16 36 36v99h45c31 0 56 25 56 56v378c0 31-25 56-56 56H252c-31 0-56-25-56-56V336Z"
    fill="#0B274A"
  />

  <!-- Terminal display -->
  <rect x="274" y="466" width="508" height="282" rx="66" fill="#FFF3E1"/>

  <!-- Custom prompt and active cursor -->
  <path
    d="m402 552 78 55-78 55"
    fill="none"
    stroke="#0B274A"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="548" y="631" width="104" height="34" rx="10" fill="#1677FF"/>

  <!-- Connected / ready status cap -->
  <circle cx="718" cy="191" r="48" fill="#1677FF"/>
