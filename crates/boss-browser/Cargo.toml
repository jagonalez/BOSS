[package]
name = "boss-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
boss-core = { path = "../boss-core" }
gpui.workspace = true
gpui-component.workspace = true
anyhow.workspace = true
async-channel.workspace = true
async-trait = "0.1"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url = "2"
base64 = "0.22"
wry = "0.56"
raw-window-handle = { version = "0.6", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSDictionary", "NSString", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[dev-dependencies]
gpui_platform.workspace = true
gpui-component-assets.workspace = true

[[example]]
name = "browser"
